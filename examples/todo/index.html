<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Local To‑Do List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>To‑Do List</h1>

    <form id="todo-form" aria-label="Add todo">
      <input id="todo-input" type="text" placeholder="Add a new task..." aria-label="New task" required />
      <button type="submit" id="add-btn">Add</button>
    </form>

    <div class="controls">
      <div class="filters" role="tablist" aria-label="Filter todos">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
      <div class="actions">
        <button id="clear-completed">Clear completed</button>
      </div>
    </div>

    <section>
      <ul id="todo-list" aria-live="polite"></ul>
    </section>

    <footer class="status">
      <span id="remaining">0</span> items left
    </footer>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
