version: '3.8'
services:
  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app:cached
    command: bash -c "pip install -e .[dev] || true && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
